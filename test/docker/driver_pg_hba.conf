# The login rules of the driver servers of docker-compose.yml. The first
# line that matches a connection decides. Each database user has its own
# login method, so a test picks the method with the user name.
#
# TYPE      DATABASE  USER             ADDRESS  METHOD

# The image's setup scripts and pg_isready use the Unix socket.
local       all       all                       trust

# dream_tls logs in only over TLS.
hostnossl   all       dream_tls        all      reject
hostssl     all       dream_tls        all      scram-sha-256

host        all       dream_trust      all      trust
host        all       dream_cleartext  all      password
host        all       dream_md5        all      md5
host        all       dream            all      scram-sha-256
